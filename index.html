<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniel &amp; Jenifer — Wedding Invitation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: auto;
}

body {
  background: #f7f1e8;
  color: #542430;
  font-family: "Inter", sans-serif;
  overflow-x: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font-family: inherit;
}

:root {
  --ivory: #f7f1e8;
  --ivory-dark: #eee2d4;
  --wine: #542430;
  --wine-dark: #32131d;
  --rose: #c88f93;
  --rose-light: #e5bfc0;
  --gold: #c79a4d;
  --gold-light: #e7c77e;
  --gold-dark: #8e6829;
  --text-soft: #826d70;
  --white: #fffdf8;
}

/* GOLD ATMOSPHERE */
.gold-atmosphere {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 50;
  overflow: hidden;
}

.gold-side {
  position: fixed;
  top: 0;
  bottom: 0;
  width: 1px;
  background: linear-gradient(
    to bottom,
    transparent,
    rgba(199,154,77,.7) 15%,
    rgba(199,154,77,.25) 50%,
    rgba(199,154,77,.7) 85%,
    transparent
  );
  z-index: 90;
}

.gold-side.left { left: 18px; }
.gold-side.right { right: 18px; }

.gold-horizontal {
  position: fixed;
  left: 0;
  right: 0;
  height: 1px;
  z-index: 90;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(199,154,77,.65),
    rgba(231,199,126,.9),
    rgba(199,154,77,.65),
    transparent
  );
}

.gold-horizontal.top { top: 18px; }
.gold-horizontal.bottom { bottom: 18px; }

.gold-corner {
  position: fixed;
  width: 70px;
  height: 70px;
  z-index: 91;
  opacity: .8;
}

.gold-corner::before,
.gold-corner::after {
  content: "";
  position: absolute;
  background: linear-gradient(90deg, var(--gold), transparent);
}

.gold-corner::before {
  width: 70px;
  height: 1px;
}

.gold-corner::after {
  width: 1px;
  height: 70px;
}

.gold-corner.tl { top: 18px; left: 18px; }
.gold-corner.tr { top: 18px; right: 18px; transform: rotate(90deg); }
.gold-corner.br { bottom: 18px; right: 18px; transform: rotate(180deg); }
.gold-corner.bl { bottom: 18px; left: 18px; transform: rotate(270deg); }

.gold-orbit {
  position: fixed;
  width: 320px;
  height: 320px;
  border: 1px solid rgba(199,154,77,.13);
  border-radius: 50%;
  z-index: 20;
  pointer-events: none;
}

.gold-orbit::before {
  content: "✦";
  position: absolute;
  top: -8px;
  left: 50%;
  color: var(--gold);
  font-size: 13px;
}

.gold-orbit.one {
  left: -190px;
  top: 25%;
  animation: orbitRotate 30s linear infinite;
}

.gold-orbit.two {
  right: -210px;
  top: 60%;
  width: 420px;
  height: 420px;
  animation: orbitRotateReverse 40s linear infinite;
}

@keyframes orbitRotate {
  to { transform: rotate(360deg); }
}

@keyframes orbitRotateReverse {
  to { transform: rotate(-360deg); }
}

#gold-particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 40;
}

.gold-particle {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--gold-light);
  box-shadow: 0 0 8px rgba(231,199,126,.7);
  opacity: .45;
}

/* OPENING SCREEN */
#opening-screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at center, #fffaf1, #eadccd);
  z-index: 9999;
  transition: opacity 1.5s cubic-bezier(.22,1,.36,1), visibility 1.5s ease;
}

#opening-screen.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.opening-glow {
  position: absolute;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(199,154,77,.17), transparent 65%);
  animation: openingGlow 4s ease-in-out infinite;
}

@keyframes openingGlow {
  0%, 100% { transform: scale(.85); opacity: .5; }
  50% { transform: scale(1.15); opacity: 1; }
}

.envelope-wrapper {
  width: 330px;
  height: 250px;
  position: relative;
  animation: envelopeFloat 4s ease-in-out infinite;
  z-index: 2;
}

.envelope {
  position: absolute;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #eee0d8, #ddc4b9);
  box-shadow: 0 40px 100px rgba(84,36,48,.22);
  overflow: hidden;
}

.envelope-letter {
  position: absolute;
  width: 75%;
  height: 70%;
  left: 12.5%;
  top: 15%;
  background: #fffdf8;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-family: "Cormorant Garamond", serif;
  font-size: 45px;
  color: var(--wine);
  box-shadow: 0 15px 35px rgba(84,36,48,.12);
  z-index: 1;
}

.envelope-letter span:nth-child(2) {
  color: var(--gold);
}

.envelope-front {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 63%;
  background: linear-gradient(135deg, #e8d2ca, #d8bbb0);
  clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
  z-index: 4;
}

.envelope-seal {
  position: absolute;
  left: 50%;
  bottom: 42px;
  transform: translateX(-50%);
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--gold-light), var(--gold-dark));
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Cormorant Garamond", serif;
  font-size: 18px;
  z-index: 6;
  box-shadow: 0 5px 20px rgba(110,70,20,.25);
}

.opening-text {
  position: absolute;
  bottom: -80px;
  width: 100%;
  text-align: center;
  color: #80696c;
  font-size: 10px;
  letter-spacing: .3em;
  text-transform: uppercase;
}

.opening-gold-line {
  position: absolute;
  width: 120px;
  height: 1px;
  background: var(--gold);
  left: 50%;
  bottom: -55px;
  transform: translateX(-50%);
  opacity: .5;
}

  0%, 100
